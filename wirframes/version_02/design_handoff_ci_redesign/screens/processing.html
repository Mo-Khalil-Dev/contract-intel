  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #FAFAF9; }
  </style>
  <style id="ci-responsive">
    /* ---------- Responsive overrides ----------
       Inline React styles win specificity-wise; use !important to override.
       Breakpoints: lg ≤ 1100px (tablet landscape), md ≤ 860px (tablet), sm ≤ 640px (phone), xs ≤ 420px */

    .ci-nav-mobile-btn { display: none; }
    .ci-nav-drawer { display: none; }

    /* Tabs scroll on narrow */
    @media (max-width: 860px) {
      .ci-tabs-scroll { overflow-x: auto !important; flex-wrap: nowrap !important; }
      .ci-tabs-scroll > button { flex-shrink: 0 !important; }

      /* Hide center nav links, show hamburger — prevents nav overflow on tablet */
      .ci-nav-links { display: none !important; }
      .ci-nav-mobile-btn { display: inline-flex !important; align-items: center; justify-content: center; }
      .ci-nav-drawer.open { display: flex !important; flex-direction: column; }
      .ci-nav-pad { padding-left: 20px !important; padding-right: 20px !important; }

      .ci-pad-32 { padding-left: 20px !important; padding-right: 20px !important; }
      .ci-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
      .ci-grid-5 { grid-template-columns: repeat(3, 1fr) !important; }
      .ci-stack-md { grid-template-columns: 1fr !important; }
      .ci-doc-grid { grid-template-columns: 1fr !important; }

      /* Results screen — split layout becomes vertical */
      .ci-results-row { flex-direction: column !important; overflow: auto !important; }
      .ci-results-main { border-right: none !important; overflow: visible !important; }
      .ci-results-side { width: 100% !important; max-width: 100% !important; flex-shrink: 0 !important; border-left: none !important; border-top: 1px solid #E5E7EB !important; }

      /* Renewals page */
      .ci-renewals-grid { grid-template-columns: 1fr !important; }

      /* Portfolio side column */
      .ci-portfolio-grid { grid-template-columns: 1fr !important; }

      /* Tables — allow horizontal scroll */
      .ci-table-wrap { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
      .ci-table-wrap > table { min-width: 640px !important; }
    }

    @media (max-width: 640px) {
      .ci-pad-32 { padding-left: 16px !important; padding-right: 16px !important; }
      .ci-nav-pad { padding-left: 16px !important; padding-right: 16px !important; }
      .ci-pad-y-lg { padding-top: 24px !important; padding-bottom: 24px !important; }

      /* Stat / KPI grids collapse */
      .ci-grid-4, .ci-grid-5 { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
      .ci-stack-sm { grid-template-columns: 1fr !important; }

      /* Hero / page titles shrink */
      .ci-page-h1 { font-size: 24px !important; }
      .ci-page-h1-lg { font-size: 26px !important; }
      .ci-page-h2 { font-size: 18px !important; }
      .ci-risk-mega { font-size: 30px !important; }

      /* Risk snapshot stacks */
      .ci-risk-snap { flex-direction: column !important; align-items: flex-start !important; gap: 14px !important; flex-wrap: wrap !important; }

      /* Detail rows — label width shrinks */
      .ci-detail-row > span:first-child { width: 110px !important; }

      /* Breadcrumb row */
      .ci-breadcrumb { padding-left: 16px !important; padding-right: 16px !important; flex-wrap: wrap !important; gap: 6px !important; }
      .ci-breadcrumb > span:nth-child(3) { max-width: 100% !important; }

      /* Action button rows wrap */
      .ci-actions-wrap { flex-wrap: wrap !important; }
      .ci-actions-wrap > * { flex: 1 1 auto; }

      /* Header (PageShell title + actions) wraps */
      .ci-page-header { flex-wrap: wrap !important; gap: 12px !important; padding-left: 16px !important; padding-right: 16px !important; }

      /* Top bar inside Home */
      .ci-home-banner { flex-wrap: wrap !important; gap: 8px !important; }

      /* Reduce big card padding */
      .ci-card-lg { padding: 18px 18px !important; }

      /* Upload drop zone */
      .ci-dropzone { padding: 36px 18px !important; }

      /* Modal */
      .ci-modal { width: calc(100vw - 24px) !important; }
    }

    @media (max-width: 420px) {
      .ci-grid-4, .ci-grid-5 { grid-template-columns: 1fr !important; }
      .ci-stack-xs { grid-template-columns: 1fr !important; }
      .ci-pad-32 { padding-left: 14px !important; padding-right: 14px !important; }
    }
  </style>
