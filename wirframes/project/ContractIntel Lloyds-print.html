<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContractIntel — Lloyds — Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; background: #F4F8F6; font-family: 'Lato', sans-serif; }
    /* Hide tweaks panel in print output */
    [data-tweaks-panel], .tweaks-panel { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="data.js"></script>
  <script type="text/babel" src="components-v4-lloyds.jsx"></script>
  <!-- Stub the Tweaks panel + hooks so screens render without controls -->
  <script type="text/babel">
    window.TweaksPanel = function() { return null; };
    window.TweakSection = function() { return null; };
    window.TweakColor = function() { return null; };
    window.TweakSlider = function() { return null; };
    window.TweakToggle = function() { return null; };
    window.TweakRadio = function() { return null; };
    window.TweakSelect = function() { return null; };
    window.TweakText = function() { return null; };
    window.TweakNumber = function() { return null; };
    window.TweakButton = function() { return null; };
    window.useTweaks = function(defaults) { return [defaults || {}, function() {}]; };
  </script>
  <script type="text/babel" src="screens-v4-contracts.jsx"></script>
  <script type="text/babel" src="screens-v4-other.jsx"></script>
  <script type="text/babel" src="app-v4-lloyds-print.jsx"></script>

  <script type="text/babel">
    // Wait for fonts + babel + render, then print
    (async () => {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      // Give Babel/React time to mount all screens
      await new Promise(r => setTimeout(r, 1500));
      window.print();
    })();
  </script>
</body>
</html>
