<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContractIntel — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'IBM Plex Mono', 'Courier New', monospace; background: #0A0A0A; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; }
    input, select, textarea { outline: none; font-family: inherit; }
    button { font-family: inherit; }
    select option { background: #141414; color: #A8A29E; }
    @keyframes ciPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes ciSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes ciBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Data -->
  <script src="../data.js"></script>

  <!-- Terminal tokens -->
  <script src="tokens-terminal.js"></script>

  <!-- Terminal components -->
  <script type="text/babel" src="components-terminal.jsx"></script>

  <!-- Tweaks panel -->
  <script type="text/babel" src="../tweaks-panel.jsx"></script>

  <!-- Screens A: Home, Upload, Processing, Results -->
  <script type="text/babel" src="screens-a-terminal.jsx"></script>

  <!-- Screens B: DeepDive, Compare, Portfolio, Export, Renewals, Settings -->
  <script type="text/babel" src="screens-b-terminal.jsx"></script>

  <!-- App shell -->
  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "layoutVariant": "table",
      "riskStyle": "accordion",
      "uploadStyle": "default",
      "scanLines": false,
      "brightness": 115
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState('home');
      const [contractId, setContractId] = useState(null);
      const [flagId, setFlagId] = useState(null);
      const [uploadedFiles, setUploadedFiles] = useState(null);

      function goTo(s, extra = {}) {
        setScreen(s);
        if (extra.contractId !== undefined) setContractId(extra.contractId);
        if (extra.flagId !== undefined) setFlagId(extra.flagId);
      }

      function handleNav(s) {
        if (s === 'home') goTo('home');
        else if (s === 'portfolio') goTo('portfolio');
        else if (s === 'compare') goTo('compare');
        else if (s === 'renewals') goTo('renewals');
        else if (s === 'settings') goTo('settings');
        else if (s === 'upload') goTo('upload');
        else goTo(s);
      }

      const filter = tweaks.brightness !== 100
        ? `brightness(${tweaks.brightness}%)`
        : undefined;

      return (
        <div style={{
          display: 'flex', flexDirection: 'column', height: '100vh',
          overflow: 'hidden', fontFamily: MONO, background: T.bg,
          filter,
          position: 'relative',
        }}>
          {/* Scan lines overlay */}
          {tweaks.scanLines && (
            <div style={{
              position: 'fixed', inset: 0, zIndex: 9999,
              background: 'repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px)',
              pointerEvents: 'none',
            }} />
          )}

          <TopNav screen={screen} onNav={handleNav} />

          <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
            {screen === 'home' && <HomeScreen onNav={handleNav} />}
            {screen === 'upload' && (
              <UploadScreen
                onBack={() => goTo('portfolio')}
                onDone={files => { setUploadedFiles(files); goTo('processing'); }}
                uploadStyle={tweaks.uploadStyle}
              />
            )}
            {screen === 'processing' && (
              <ProcessingScreen
                files={uploadedFiles}
                onDone={() => { setContractId(1); goTo('results', { contractId: 1 }); }}
              />
            )}
            {screen === 'results' && contractId && (
              <ResultsScreen
                contractId={contractId}
                onBack={() => goTo('portfolio')}
                onDeepDive={fid => goTo('deepdive', { flagId: fid })}
                onExport={() => goTo('export')}
                onNav={id => goTo('results', { contractId: id })}
                riskStyle={tweaks.riskStyle}
              />
            )}
            {screen === 'deepdive' && contractId && (
              <DeepDiveScreen
                contractId={contractId}
                flagId={flagId}
                onBack={() => goTo('results', { contractId })}
              />
            )}
            {screen === 'compare' && (
              <CompareScreen onSelectContract={id => goTo('results', { contractId: id })} />
            )}
            {screen === 'portfolio' && (
              <PortfolioScreen
                onSelect={id => goTo('results', { contractId: id })}
                onUpload={() => goTo('upload')}
                layoutVariant={tweaks.layoutVariant}
              />
            )}
            {screen === 'export' && (
              <ExportScreen
                contractId={contractId}
                onBack={() => goTo('results', { contractId })}
              />
            )}
            {screen === 'renewals' && <RenewalsScreen />}
            {screen === 'settings' && <SettingsScreen />}
          </div>

          <TweaksPanel>
            <TweakSection label="Layout">
              <TweakRadio
                label="Contract list view"
                value={tweaks.layoutVariant}
                options={[{ value: 'table', label: 'Table' }, { value: 'card', label: 'Cards' }, { value: 'minimal', label: 'Minimal' }]}
                onChange={v => setTweak('layoutVariant', v)}
              />
              <TweakRadio
                label="Risk flag style"
                value={tweaks.riskStyle}
                options={[{ value: 'accordion', label: 'Accordion' }, { value: 'cards', label: 'Cards' }]}
                onChange={v => setTweak('riskStyle', v)}
              />
            </TweakSection>
            <TweakSection label="Display">
              <TweakToggle label="Scan lines" value={tweaks.scanLines} onChange={v => setTweak('scanLines', v)} />
              <TweakSlider label="Brightness" value={tweaks.brightness} min={60} max={120} step={5} onChange={v => setTweak('brightness', v)} />
            </TweakSection>
            <TweakSection label="Quick nav">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                {[
                  { label: 'Home',               s: 'home' },
                  { label: 'Upload',             s: 'upload' },
                  { label: 'Processing',         s: 'processing' },
                  { label: 'Results (1)',        s: 'results',  extra: { contractId: 1 } },
                  { label: 'Deep Dive (Flag 1)', s: 'deepdive', extra: { contractId: 1, flagId: 1 } },
                  { label: 'Compare',            s: 'compare' },
                  { label: 'Portfolio',          s: 'portfolio' },
                  { label: 'Export',             s: 'export',   extra: { contractId: 1 } },
                  { label: 'Renewals',           s: 'renewals' },
                  { label: 'Settings',           s: 'settings' },
                ].map(item => (
                  <button key={item.s + (item.extra?.contractId||'') + (item.extra?.flagId||'')}
                    onClick={() => goTo(item.s, item.extra || {})}
                    style={{
                      background: screen === item.s ? T.amberDim : 'transparent',
                      color: screen === item.s ? T.amber : T.inkSoft,
                      border: 'none', padding: '4px 8px',
                      textAlign: 'left', cursor: 'pointer', fontSize: 10,
                      fontFamily: MONO, letterSpacing: '0.06em',
                    }}>
                    {screen === item.s ? '> ' : '  '}{item.label}
                  </button>
                ))}
              </div>
            </TweakSection>
          </TweaksPanel>

          <style>{`
            * { box-sizing: border-box; }
            input:focus, select:focus { border-color: ${T.amber} !important; }
            button:focus-visible { outline: 1px solid ${T.amber}; outline-offset: 1px; }
          `}</style>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="84" fill="#0A0A0A"/>
      <rect x="0" y="0" width="120" height="11" fill="#141414"/>
      <rect x="8" y="3" width="8" height="5" fill="#D4A847" opacity="0.9"/>
      <rect x="20" y="4" width="20" height="3" fill="#3A3A37" opacity="0.6"/>
      <rect x="44" y="4" width="16" height="3" fill="#3A3A37" opacity="0.4"/>
      <rect x="0" y="11" width="120" height="1" fill="#242424"/>
      <rect x="8" y="18" width="50" height="5" rx="0" fill="#1F1F1F" stroke="#242424" stroke-width="0.5"/>
      <rect x="8" y="26" width="30" height="3" fill="#D4A847" opacity="0.7"/>
      <rect x="8" y="32" width="20" height="2" fill="#6B6560" opacity="0.5"/>
      <rect x="8" y="40" width="104" height="1" fill="#242424"/>
      <rect x="8" y="44" width="104" height="8" fill="#141414" stroke="#242424" stroke-width="0.5"/>
      <rect x="10" y="46" width="30" height="1" fill="#E05252" opacity="0.7"/>
      <rect x="10" y="49" width="25" height="1" fill="#C47B2A" opacity="0.7"/>
      <rect x="8" y="55" width="104" height="8" fill="#141414" stroke="#242424" stroke-width="0.5"/>
      <rect x="10" y="57" width="20" height="1" fill="#4A9E6B" opacity="0.7"/>
      <rect x="10" y="60" width="28" height="1" fill="#A8A29E" opacity="0.4"/>
      <rect x="8" y="66" width="104" height="8" fill="#141414" stroke="#242424" stroke-width="0.5"/>
      <rect x="10" y="68" width="15" height="1" fill="#C47B2A" opacity="0.7"/>
      <rect x="10" y="71" width="32" height="1" fill="#A8A29E" opacity="0.4"/>
    </svg>
  </template>
</body>
</html>
