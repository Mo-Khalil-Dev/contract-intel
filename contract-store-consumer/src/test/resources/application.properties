# Test config.
quarkus.jackson.accept-case-insensitive-enums=true

# Disable SmallRye Fault Tolerance in tests so @Retry backoff (1s->2s->4s->8s) doesn't
# slow assertions. With FT off, transient/not-found exceptions propagate immediately,
# so the scenario tests can assert the exception type directly.
MP_Fault_Tolerance_NonFallback_Enabled=false

# Use the in-memory connector in tests so NO Kafka broker (and no Docker) is needed to
# boot @QuarkusTest. The listener channel is wired to in-memory and simply sits idle;
# the tests drive the services directly.
mp.messaging.incoming.contract-store-events.connector=smallrye-in-memory

# REST client base URLs (the WireMockResource overrides these per scenario test).
quarkus.rest-client."contract-store".url=http://localhost:8089
quarkus.rest-client."governance".url=http://localhost:8089
