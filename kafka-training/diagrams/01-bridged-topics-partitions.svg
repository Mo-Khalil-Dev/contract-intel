<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1460" height="790" fill="#FFFFFF"/>
  <defs>
    <marker id="aP" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="aS" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="aG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
    <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
  </defs>

  <text x="730" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Topics &amp; partitions: the source, our copy, and our DLQ</text>
  <text x="730" y="68" text-anchor="middle" font-size="14" fill="#64748B">A topic is a named stream; each topic is split into partitions. The DLQ is simply another topic we own.</text>

  <!-- ===================== HELIOS SOURCE ===================== -->
  <rect x="36" y="100" width="340" height="340" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <rect x="36" y="100" width="340" height="46" rx="10" fill="#C2410C"/><rect x="36" y="128" width="340" height="18" fill="#C2410C"/>
  <text x="206" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Helios / Collibra — Contract Store</text>
  <text x="206" y="139" text-anchor="middle" font-size="11" fill="#FFE5D0">they own the source</text>

  <!-- TOPIC frame -->
  <rect x="52" y="158" width="308" height="268" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="62" y="176" font-size="12" font-weight="700" fill="#9A3412">TOPIC: contract events  ·  4 partitions</text>
  <g font-size="10.5" fill="#7C2D12">
  <rect x="66" y="186" width="280" height="52" rx="5" fill="#FFF7ED" stroke="#FED7AA"/><text x="80" y="216" font-size="11" font-weight="700" fill="#9A3412">Partition 0</text>
  <rect x="164" y="198" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="186" y="216" text-anchor="middle">C‑101</text><rect x="216" y="198" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="238" y="216" text-anchor="middle">C‑105</text>
  <rect x="66" y="244" width="280" height="52" rx="5" fill="#FFF7ED" stroke="#FED7AA"/><text x="80" y="274" font-size="11" font-weight="700" fill="#9A3412">Partition 1</text>
  <rect x="164" y="256" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="186" y="274" text-anchor="middle">C‑102</text>
  <rect x="66" y="302" width="280" height="52" rx="5" fill="#FFF7ED" stroke="#FED7AA"/><text x="80" y="332" font-size="11" font-weight="700" fill="#9A3412">Partition 2</text>
  <rect x="164" y="314" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="186" y="332" text-anchor="middle">C‑103</text><rect x="216" y="314" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="238" y="332" text-anchor="middle">C‑107</text>
  <rect x="66" y="360" width="280" height="52" rx="5" fill="#FFF7ED" stroke="#FED7AA"/><text x="80" y="390" font-size="11" font-weight="700" fill="#9A3412">Partition 3</text>
  <rect x="164" y="372" width="44" height="28" rx="4" fill="#FED7AA" stroke="#FB923C"/><text x="186" y="390" text-anchor="middle">C‑104</text>
  </g>

  <!-- ===================== BRIDGE ===================== -->
  <text x="430" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">Bridge / Replication</text>
  <line x1="380" y1="278" x2="482" y2="278" stroke="#6D28D9" stroke-width="4" marker-end="url(#aP)"/>
  <text x="430" y="300" text-anchor="middle" font-size="10" fill="#64748B">keys + order preserved</text>
  <text x="430" y="315" text-anchor="middle" font-size="10" fill="#64748B">onboarding‑managed</text>

  <!-- ===================== OUR TENANCY ===================== -->
  <rect x="490" y="96" width="930" height="358" rx="12" fill="#F7FEFF" stroke="#A5F3FC" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="506" y="118" font-size="13" font-weight="700" fill="#0E7490">OUR DMP TENANCY — the topics we own</text>

  <!-- Topic A: contract-events -->
  <rect x="506" y="132" width="430" height="306" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <rect x="506" y="132" width="430" height="42" rx="10" fill="#0E7490"/><rect x="506" y="158" width="430" height="16" fill="#0E7490"/>
  <text x="721" y="153" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">TOPIC: contract‑events</text>
  <text x="721" y="169" text-anchor="middle" font-size="10.5" fill="#CFFAFE">the events we consume · 4 partitions</text>
  <g font-size="10.5" fill="#134E4A">
  <rect x="522" y="186" width="398" height="52" rx="5" fill="#FFFFFF" stroke="#A5F3FC"/><text x="536" y="216" font-size="11" font-weight="700" fill="#155E75">Partition 0</text>
  <rect x="632" y="198" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="654" y="216" text-anchor="middle">C‑101</text><rect x="684" y="198" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="706" y="216" text-anchor="middle">C‑105</text>
  <rect x="522" y="244" width="398" height="52" rx="5" fill="#FFFFFF" stroke="#A5F3FC"/><text x="536" y="274" font-size="11" font-weight="700" fill="#155E75">Partition 1</text>
  <rect x="632" y="256" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="654" y="274" text-anchor="middle">C‑102</text>
  <rect x="522" y="302" width="398" height="52" rx="5" fill="#FFFFFF" stroke="#A5F3FC"/><text x="536" y="332" font-size="11" font-weight="700" fill="#155E75">Partition 2</text>
  <rect x="632" y="314" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="654" y="332" text-anchor="middle">C‑103</text><rect x="684" y="314" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="706" y="332" text-anchor="middle">C‑107</text>
  <rect x="522" y="360" width="398" height="52" rx="5" fill="#FFFFFF" stroke="#A5F3FC"/><text x="536" y="390" font-size="11" font-weight="700" fill="#155E75">Partition 3</text>
  <rect x="632" y="372" width="44" height="28" rx="4" fill="#A5F3FC" stroke="#22D3EE"/><text x="654" y="390" text-anchor="middle">C‑104</text>
  </g>

  <!-- Topic B: DLQ, BESIDE the events topic -->
  <rect x="956" y="132" width="252" height="180" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <rect x="956" y="132" width="252" height="42" rx="10" fill="#B91C1C"/><rect x="956" y="158" width="252" height="16" fill="#B91C1C"/>
  <text x="1082" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TOPIC: contract‑events‑dlt</text>
  <text x="1082" y="169" text-anchor="middle" font-size="10.5" fill="#FECACA">our DLQ · 1 partition</text>
  <rect x="972" y="186" width="220" height="108" rx="5" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="986" y="208" font-size="11" font-weight="700" fill="#991B1B">Partition 0</text>
  <rect x="1060" y="224" width="52" height="28" rx="4" fill="#FEE2E2" stroke="#F87171"/><text x="1086" y="242" text-anchor="middle" font-size="10" fill="#991B1B">C‑777 ✗</text>
  <text x="1082" y="278" text-anchor="middle" font-size="9.5" fill="#B91C1C">failed events land here</text>

  <!-- DLQ side note -->
  <rect x="1222" y="132" width="186" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1234" y="156" font-size="11.5" font-weight="700" fill="#334155">A DLQ is just</text>
  <text x="1234" y="172" font-size="11.5" font-weight="700" fill="#334155">another topic</text>
  <text x="1234" y="196" font-size="10.5" fill="#475569">Same structure:</text>
  <text x="1234" y="212" font-size="10.5" fill="#475569">topic → partitions.</text>
  <text x="1234" y="236" font-size="10.5" fill="#475569">Usually 1 partition</text>
  <text x="1234" y="252" font-size="10.5" fill="#475569">(volume is low).</text>
  <text x="1234" y="276" font-size="10.5" fill="#475569">We own &amp; operate it</text>
  <text x="1234" y="292" font-size="10.5" fill="#475569">— SmallRye auto‑</text>
  <text x="1234" y="308" font-size="10.5" fill="#475569">publishes to it.</text>

  <!-- ===================== CONSUMERS + OUTCOMES ===================== -->
  <!-- read arrow -->
  <line x1="721" y1="438" x2="721" y2="500" stroke="#15803D" stroke-width="3.5" marker-end="url(#aG)"/>
  <text x="737" y="474" font-size="11" font-weight="700" fill="#15803D">read / poll</text>

  <rect x="506" y="502" width="430" height="74" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="721" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Ingestion consumer microservice</text>
  <text x="721" y="548" text-anchor="middle" font-size="11" fill="#15803D">consumer group · 4 pods / consumers (1 per partition)</text>
  <text x="721" y="565" text-anchor="middle" font-size="10" fill="#64748B">each pod / consumer owns one partition → ordered, no double‑processing</text>

  <!-- success -> marketplace -->
  <line x1="640" y1="576" x2="640" y2="632" stroke="#15803D" stroke-width="3" marker-end="url(#aG)"/>
  <text x="520" y="610" font-size="11" font-weight="700" fill="#15803D">success →</text>
  <ellipse cx="640" cy="636" rx="104" ry="12" fill="#BFDBFE" stroke="#60A5FA"/><rect x="536" y="636" width="208" height="46" fill="#DBEAFE" stroke="#60A5FA"/><line x1="536" y1="636" x2="536" y2="682" stroke="#60A5FA"/><line x1="744" y1="636" x2="744" y2="682" stroke="#60A5FA"/><ellipse cx="640" cy="682" rx="104" ry="12" fill="#DBEAFE" stroke="#60A5FA"/><ellipse cx="640" cy="636" rx="104" ry="12" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="640" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Data Marketplace</text>
  <text x="640" y="674" text-anchor="middle" font-size="10" fill="#1D4ED8">idempotent upsert · version guard</text>

  <!-- failure -> DLQ topic (up-right to Topic B) -->
  <path d="M936,520 C1010,520 1060,430 1082,316" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#aR)"/>
  <text x="1012" y="520" font-size="11" font-weight="700" fill="#DC2626">on failure → publish to DLQ</text>
  <text x="1012" y="536" font-size="9.5" fill="#B91C1C">(after retries on transient errors)</text>

  <!-- DLQ handling compact -->
  <rect x="956" y="560" width="452" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="972" y="584" font-size="13" font-weight="700" fill="#0F172A">The DLQ is a process, not a bin</text>
  <text x="972" y="608" font-size="11" fill="#334155">• <tspan font-weight="700">Alert</tspan> — Dynatrace → Teams / PagerDuty on DLT count &gt; 0</text>
  <text x="972" y="630" font-size="11" fill="#334155">• <tspan font-weight="700">Runbook</tspan> — triage via headers (dead‑letter‑reason, correlationId)</text>
  <text x="972" y="652" font-size="11" fill="#334155">• <tspan font-weight="700">Replay</tspan> (fixed → reprocess, idempotent‑safe) or <tspan font-weight="700">Quarantine</tspan> (dead data)</text>
  <text x="972" y="676" font-size="10.5" font-style="italic" fill="#334155">Every failure is individually identifiable — a Collibra success never</text>
  <text x="972" y="692" font-size="10.5" font-style="italic" fill="#334155">hides our load failing.</text>
</svg>
