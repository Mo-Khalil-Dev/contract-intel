<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1130" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="1130" fill="#FFFFFF"/>
  <defs>
    <marker id="aP" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="aS" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <text x="750" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Environments &amp; how we inject / test events</text>
  <text x="750" y="68" text-anchor="middle" font-size="14" fill="#64748B">Same service image everywhere — only config differs. Local Dev is self‑contained (no Helios); INT / PreProd / Prod each bridge to the matching Helios environment.</text>

  <!-- ===== column headers (shared) ===== -->
  <text x="177" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94A3B8">EVENT SOURCE</text>
  <text x="490" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94A3B8">OUR KAFKA (this env)</text>
  <text x="735" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94A3B8">CONSUMER</text>
  <text x="930" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94A3B8">STORE</text>
  <text x="1264" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#94A3B8">HOW WE TEST HERE</text>

  <!-- ============================= LANE 1 — LOCAL DEV (Cy=225) ============================= -->
  <rect x="40" y="100" width="1440" height="210" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.8"/>
  <rect x="58" y="110" width="128" height="30" rx="15" fill="#7C3AED"/><text x="122" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">LOCAL DEV</text>
  <text x="196" y="131" font-size="11.5" fill="#6D28D9">your Mac — not a real Kafka</text>

  <rect x="70" y="193" width="215" height="64" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="177" y="217" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Fake events (you)</text>
  <text x="177" y="236" text-anchor="middle" font-size="10.5" fill="#64748B">NO Helios bridge</text>
  <line x1="287" y1="225" x2="357" y2="225" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aS)"/>
  <text x="322" y="214" text-anchor="middle" font-size="9.5" fill="#64748B">you publish</text>

  <rect x="362" y="180" width="256" height="90" rx="8" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="490" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">Local Kafka (Dev Services)</text>
  <rect x="376" y="205" width="228" height="24" rx="4" fill="#DCFCE7" stroke="#86EFAC"/><text x="490" y="222" text-anchor="middle" font-size="10.5" fill="#166534">contract‑events</text>
  <rect x="376" y="235" width="228" height="24" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/><text x="490" y="252" text-anchor="middle" font-size="10.5" fill="#991B1B">contract‑events‑dlt</text>

  <line x1="618" y1="225" x2="656" y2="225" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <rect x="660" y="197" width="150" height="56" rx="8" fill="#F0FDF4" stroke="#86EFAC"/><text x="735" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Consumer</text><text x="735" y="239" text-anchor="middle" font-size="10" fill="#15803D">1 local instance</text>
  <line x1="810" y1="225" x2="852" y2="225" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <ellipse cx="930" cy="199" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/><rect x="862" y="199" width="136" height="52" fill="#DBEAFE" stroke="#60A5FA"/><line x1="862" y1="199" x2="862" y2="251" stroke="#60A5FA"/><line x1="998" y1="199" x2="998" y2="251" stroke="#60A5FA"/><ellipse cx="930" cy="251" rx="68" ry="9" fill="#DBEAFE" stroke="#60A5FA"/><ellipse cx="930" cy="199" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="930" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Postgres :5433</text>

  <rect x="1050" y="157" width="414" height="136" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1064" y="178" font-size="12" font-weight="700" fill="#5B21B6">Options (not just a local Kafka UI):</text>
  <text x="1064" y="200" font-size="11" fill="#334155">• Quarkus <tspan font-weight="700">Dev Services</tspan> — auto Kafka+Postgres, no manual containers</text>
  <text x="1064" y="220" font-size="11" fill="#334155">• SmallRye <tspan font-weight="700">in‑memory connector</tspan> — unit tests, no broker at all</text>
  <text x="1064" y="240" font-size="11" fill="#334155">• <tspan font-weight="700">Kafka Companion</tspan> — integration tests, assert on DLT</text>
  <text x="1064" y="260" font-size="11" fill="#334155">• docker‑compose + <tspan font-weight="700">Kafka UI</tspan> — manual produce / inspect</text>
  <text x="1064" y="282" font-size="10.5" font-style="italic" fill="#6D28D9">→ Dev Services / in‑memory / Companion are the alternatives to a UI.</text>

  <!-- ============================= LANE 2 — INT (Cy=450) ============================= -->
  <rect x="40" y="325" width="1440" height="210" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.8"/>
  <rect x="58" y="335" width="70" height="30" rx="15" fill="#1D4ED8"/><text x="93" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">INT</text>
  <text x="138" y="356" font-size="11.5" fill="#1D4ED8">first real environment — where we prove it end‑to‑end</text>

  <rect x="70" y="418" width="215" height="64" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="177" y="442" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">Helios INT topic</text>
  <text x="177" y="461" text-anchor="middle" font-size="10.5" fill="#B45309">Collibra = Contract Store</text>
  <line x1="287" y1="450" x2="357" y2="450" stroke="#6D28D9" stroke-width="3.5" marker-end="url(#aP)"/>
  <text x="322" y="439" text-anchor="middle" font-size="9.5" fill="#6D28D9">bridge</text>

  <rect x="362" y="405" width="256" height="90" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="490" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Our Kafka — KaaS INT</text>
  <rect x="376" y="430" width="228" height="24" rx="4" fill="#DCFCE7" stroke="#86EFAC"/><text x="490" y="447" text-anchor="middle" font-size="10.5" fill="#166534">contract‑events</text>
  <rect x="376" y="460" width="228" height="24" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/><text x="490" y="477" text-anchor="middle" font-size="10.5" fill="#991B1B">contract‑events‑dlt</text>

  <line x1="618" y1="450" x2="656" y2="450" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <rect x="660" y="422" width="150" height="56" rx="8" fill="#F0FDF4" stroke="#86EFAC"/><text x="735" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Consumer pods</text><text x="735" y="464" text-anchor="middle" font-size="10" fill="#15803D">GKE · INT</text>
  <line x1="810" y1="450" x2="852" y2="450" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <ellipse cx="930" cy="424" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/><rect x="862" y="424" width="136" height="52" fill="#DBEAFE" stroke="#60A5FA"/><line x1="862" y1="424" x2="862" y2="476" stroke="#60A5FA"/><line x1="998" y1="424" x2="998" y2="476" stroke="#60A5FA"/><ellipse cx="930" cy="476" rx="68" ry="9" fill="#DBEAFE" stroke="#60A5FA"/><ellipse cx="930" cy="424" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="930" y="453" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Marketplace INT</text>

  <rect x="1050" y="382" width="414" height="136" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="1064" y="403" font-size="12" font-weight="700" fill="#1D4ED8">Three ways in:</text>
  <text x="1064" y="425" font-size="11" fill="#334155">(a) change a contract in <tspan font-weight="700">Collibra / Helios</tspan> → real event, full chain</text>
  <text x="1064" y="445" font-size="11" fill="#334155">(b) publish a crafted event via <tspan font-weight="700">Kafka UI / Confluent C3</tspan></text>
  <text x="1064" y="465" font-size="11" fill="#334155">(c) <tspan font-weight="700">scripted Avro producer / kcat</tspan> onto the topic</text>
  <text x="1064" y="489" font-size="10.5" fill="#B91C1C">⚠ (b)&amp;(c) need WRITE on the topic — our consumer is READ‑only.</text>
  <text x="1064" y="506" font-size="10.5" fill="#B91C1C">Use a test identity / non‑prod grant, or inject upstream.</text>

  <!-- ============================= LANE 3 — PREPROD (Cy=675) ============================= -->
  <rect x="40" y="550" width="1440" height="210" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.8"/>
  <rect x="58" y="560" width="112" height="30" rx="15" fill="#B45309"/><text x="114" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PRE‑PROD</text>
  <text x="180" y="581" font-size="11.5" fill="#B45309">production‑like — final validation before go‑live</text>

  <rect x="70" y="643" width="215" height="64" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="177" y="667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">Helios PRE topic</text>
  <text x="177" y="686" text-anchor="middle" font-size="10.5" fill="#B45309">Collibra (PRE)</text>
  <line x1="287" y1="675" x2="357" y2="675" stroke="#6D28D9" stroke-width="3.5" marker-end="url(#aP)"/>
  <text x="322" y="664" text-anchor="middle" font-size="9.5" fill="#6D28D9">bridge</text>

  <rect x="362" y="630" width="256" height="90" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="490" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">Our Kafka — KaaS PRE</text>
  <rect x="376" y="655" width="228" height="24" rx="4" fill="#DCFCE7" stroke="#86EFAC"/><text x="490" y="672" text-anchor="middle" font-size="10.5" fill="#166534">contract‑events</text>
  <rect x="376" y="685" width="228" height="24" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/><text x="490" y="702" text-anchor="middle" font-size="10.5" fill="#991B1B">contract‑events‑dlt</text>

  <line x1="618" y1="675" x2="656" y2="675" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <rect x="660" y="647" width="150" height="56" rx="8" fill="#F0FDF4" stroke="#86EFAC"/><text x="735" y="671" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Consumer pods</text><text x="735" y="689" text-anchor="middle" font-size="10" fill="#15803D">GKE · PRE</text>
  <line x1="810" y1="675" x2="852" y2="675" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <ellipse cx="930" cy="649" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/><rect x="862" y="649" width="136" height="52" fill="#DBEAFE" stroke="#60A5FA"/><line x1="862" y1="649" x2="862" y2="701" stroke="#60A5FA"/><line x1="998" y1="649" x2="998" y2="701" stroke="#60A5FA"/><ellipse cx="930" cy="701" rx="68" ry="9" fill="#DBEAFE" stroke="#60A5FA"/><ellipse cx="930" cy="649" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="930" y="678" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Marketplace PRE</text>

  <rect x="1050" y="607" width="414" height="136" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="1064" y="628" font-size="12" font-weight="700" fill="#B45309">Prod‑like, so test carefully:</text>
  <text x="1064" y="650" font-size="11" fill="#334155">• Prefer a <tspan font-weight="700">real upstream change</tspan> in Collibra / Helios PRE</text>
  <text x="1064" y="670" font-size="11" fill="#334155">• Manual UI publish is usually <tspan font-weight="700">restricted</tspan> — confirm with KaaS</text>
  <text x="1064" y="690" font-size="11" fill="#334155">• Use for NFT / load / failover rehearsal</text>
  <text x="1064" y="712" font-size="10.5" fill="#334155">• <tspan font-weight="700">Reconcile</tspan> Marketplace vs Collibra to prove alignment</text>
  <text x="1064" y="730" font-size="10.5" font-style="italic" fill="#B45309">Closest rehearsal of Prod before go‑live.</text>

  <!-- ============================= LANE 4 — PROD (Cy=900) ============================= -->
  <rect x="40" y="775" width="1440" height="210" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8"/>
  <rect x="58" y="785" width="80" height="30" rx="15" fill="#B91C1C"/><text x="98" y="805" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PROD</text>
  <text x="148" y="806" font-size="11.5" fill="#B91C1C">live — real contracts, real users. Observe, don't inject.</text>

  <rect x="70" y="868" width="215" height="64" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="177" y="892" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">Helios PROD topic</text>
  <text x="177" y="911" text-anchor="middle" font-size="10.5" fill="#B45309">Collibra (PROD)</text>
  <line x1="287" y1="900" x2="357" y2="900" stroke="#6D28D9" stroke-width="3.5" marker-end="url(#aP)"/>
  <text x="322" y="889" text-anchor="middle" font-size="9.5" fill="#6D28D9">bridge</text>

  <rect x="362" y="855" width="256" height="90" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="490" y="873" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Our Kafka — KaaS PROD</text>
  <rect x="376" y="880" width="228" height="24" rx="4" fill="#DCFCE7" stroke="#86EFAC"/><text x="490" y="897" text-anchor="middle" font-size="10.5" fill="#166534">contract‑events</text>
  <rect x="376" y="910" width="228" height="24" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/><text x="490" y="927" text-anchor="middle" font-size="10.5" fill="#991B1B">contract‑events‑dlt</text>

  <line x1="618" y1="900" x2="656" y2="900" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <rect x="660" y="872" width="150" height="56" rx="8" fill="#F0FDF4" stroke="#86EFAC"/><text x="735" y="896" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Consumer pods</text><text x="735" y="914" text-anchor="middle" font-size="10" fill="#15803D">GKE · PROD</text>
  <line x1="810" y1="900" x2="852" y2="900" stroke="#475569" stroke-width="2.3" marker-end="url(#aS)"/>
  <ellipse cx="930" cy="874" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/><rect x="862" y="874" width="136" height="52" fill="#DBEAFE" stroke="#60A5FA"/><line x1="862" y1="874" x2="862" y2="926" stroke="#60A5FA"/><line x1="998" y1="874" x2="998" y2="926" stroke="#60A5FA"/><ellipse cx="930" cy="926" rx="68" ry="9" fill="#DBEAFE" stroke="#60A5FA"/><ellipse cx="930" cy="874" rx="68" ry="9" fill="#BFDBFE" stroke="#60A5FA"/>
  <text x="930" y="903" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Marketplace PROD</text>

  <rect x="1050" y="832" width="414" height="136" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="1064" y="853" font-size="12" font-weight="700" fill="#B91C1C">No manual injection:</text>
  <text x="1064" y="875" font-size="11" fill="#334155">• Real contract events only — <tspan font-weight="700">never</tspan> hand‑publish</text>
  <text x="1064" y="895" font-size="11" fill="#334155">• Validate via <tspan font-weight="700">observability</tspan>: Dynatrace, consumer lag</text>
  <text x="1064" y="915" font-size="11" fill="#334155">• <tspan font-weight="700">DLQ alerts</tspan> catch failures as they happen</text>
  <text x="1064" y="937" font-size="10.5" fill="#334155">• <tspan font-weight="700">Reconcile</tspan> Marketplace vs Collibra → catches misalignment</text>
  <text x="1064" y="955" font-size="10.5" font-style="italic" fill="#B91C1C">(Liam's concern: a Collibra success must never hide our failure.)</text>

  <!-- ===== bottom takeaway strip ===== -->
  <rect x="40" y="1002" width="1440" height="104" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="1028" font-size="14" font-weight="700" fill="#0F172A">The 4 things to remember</text>
  <text x="62" y="1052" font-size="12" fill="#334155">1 · Each environment has its <tspan font-weight="700">own</tspan> Kafka instance, and its own bridge to the <tspan font-weight="700">matching</tspan> Helios topic (INT↔INT, PRE↔PRE, PROD↔PROD).</text>
  <text x="62" y="1072" font-size="12" fill="#334155">2 · <tspan font-weight="700">Local Dev fakes events</tspan> — no Helios. &#160;&#160; 3 · <tspan font-weight="700">Truest test</tspan> = change a real contract upstream in Collibra; <tspan font-weight="700">fastest test</tspan> = publish via Kafka UI (needs produce rights).</text>
  <text x="62" y="1092" font-size="12" fill="#334155">4 · <tspan font-weight="700">Prod is observe‑only</tspan> — we never inject there; we watch Dynatrace, DLQ alerts, and reconcile against Collibra.</text>
</svg>
