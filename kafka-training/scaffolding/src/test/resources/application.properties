# Test config for the scenario tests.
quarkus.jackson.accept-case-insensitive-enums=true

# Disable SmallRye Fault Tolerance in tests so @Retry backoff (1s->2s->4s->8s) doesn't
# slow assertions. With FT off, transient/not-found exceptions propagate immediately,
# so the scenario tests can assert the exception type directly.
MP_Fault_Tolerance_NonFallback_Enabled=false
