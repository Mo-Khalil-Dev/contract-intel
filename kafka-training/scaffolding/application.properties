# ============================================================================
# Incoming channel: contract-store events  (Phase 2 & 3)
# Merge these keys into the service's real application.properties.
# ============================================================================

mp.messaging.incoming.contract-store-events.connector=smallrye-kafka
mp.messaging.incoming.contract-store-events.topic=${CONTRACT_STORE_EVENTS_TOPIC:contract_store_events}
mp.messaging.incoming.contract-store-events.group.id=${KAFKA_CONSUMER_GROUP:contractstore-streaming}

# ---- Typed deserialization (JSON -> ContractStoreEventDto) ----
mp.messaging.incoming.contract-store-events.value.deserializer=com.lbg.quarkus.messaging.ContractStoreEventDeserializer
quarkus.jackson.accept-case-insensitive-enums=true

# ---- Acknowledgement / offsets (manual ack, at-least-once) ----
# We ack in code AFTER success; SmallRye commits offsets with the throttled strategy.
mp.messaging.incoming.contract-store-events.commit-strategy=throttled
mp.messaging.incoming.contract-store-events.enable.auto.commit=false
mp.messaging.incoming.contract-store-events.auto.offset.reset=earliest

# ---- Failure strategy: on nack, publish to the DLQ topic ----
mp.messaging.incoming.contract-store-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.contract-store-events.dead-letter-queue.topic=${CONTRACT_STORE_EVENTS_DLQ_TOPIC:contract_store_events_dlq}

# ---- Un-parseable JSON: don't crash the consumer -> route to DLQ (can't retry bad bytes) ----
mp.messaging.incoming.contract-store-events.fail-on-deserialization-failure=false

# ---- Bounded reconnect so auth/connection failures don't loop forever ----
mp.messaging.incoming.contract-store-events.reconnect-attempts=5
mp.messaging.incoming.contract-store-events.reconnect-interval=5

# ============================================================================
# Phase 3 — API clients (resilience lives here: @Timeout / @CircuitBreaker)
#   quarkus.rest-client."contract-store".url=${CONTRACT_STORE_URL}
#   quarkus.rest-client."governance".url=${GOVERNANCE_URL}
# ============================================================================
